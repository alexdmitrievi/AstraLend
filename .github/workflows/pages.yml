name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Превью версии до редизайна берётся из старого коммита,
          # поэтому нужна полная история, а не только последний коммит.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Сборка без basePath: сайт отдаётся из корня кастомного домена
      # m-astra.ru (домен фиксируется файлом public/CNAME и настройкой
      # repo → Settings → Pages → Custom domain).
      - run: npm run build
      - name: Превью версии до редизайна на /before/
        run: ./scripts/build-before-preview.sh /before out/before
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
